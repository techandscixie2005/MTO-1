arch authority permits reviewed in-scope pilots without another user approval; no new fit or test scoring is authorized merely by this heartbeat.\n\nDevelop quantum-chemistry-informed single-model improvements using available geometry and audited training labels. Treat response operators, dipole integrals, transition densities, electron–hole factors and physical interpretations as hypotheses. Audit reconstruction, phase, full-TDDFT X/Y, degeneracy and symmetry; never invent absent labels or require unavailable QC labels at inference. Review historical null experiments before proposing a different rationale. Each new pilot needs a fixed protocol, matched controls, independent source/preflight review, resource admission, validation-based checkpoint selection and a seed-confirmation gate. Report each seed as a separate predictor.\n\nFind suitable public datasets and audit existing-data re-splits before training or fresh scoring. Inspect structures, identities, provenance, QC method/basis, units, state definitions and historical exposure before new-test target values or predictions. Require molecular-group disjointness across training, internal calibration, validation and every claimed independent test, including duplicate graphs/stereochemistry, conformers and equivalent geometries where available. Audit every dataset used to train or tune a candidate. Keep identity arrays private. Preserve old frozen splits for historical comparisons; create a separately versioned group-disjoint benchmark and fresh baseline when needed. A legacy checkpoint is ineligible for test rows it trained on, and an exposed-data reshuffle is not a genuinely fresh holdout.\n\nSeal new-test targets and predictions during development. Before any new-test scoring, root must record a frozen candidate, protocol, group-disjoint split audit and compatible evaluation cohort. Never tune designs, hyperparameters, checkpoint choice or exclusions on new-test outcomes. Report a failed confirmation honestly and mark it exposed before further development; obtain another untouched holdout for later confirmation. Do not pool incompatible methods or datasets opportunistically. Retain every valid raw-f label, including zeros, within prespecified cohorts; report pooled raw-f R², per-state and bright-tail errors and uncertainty. Distinguish reused historical evidence from fresh confirmation.\n\nEvery four hours, the dedicated monitoring subagent checks only explicitly registered owned jobs using PID/start/boot/UID/cwd/argv identity, actual resource placement, progress, terminal receipts and resumable metadata. Preserve unrelated jobs, GPU health exclusions and the existing read-only server cron. Keep this existing heartbeat and create no duplicate. An agent interruption, stale PID or missing observation is not a training failure. Record actual failures and coordinate safe recovery; never signal unknown jobs, reset GPUs or blindly restart. Use healthy admitted GPUs only when required by the reviewed protocol, with pre-import UUID binding and shared locks.\n\nAfter every completed or failed round, finish honest reviews and root decisions. FIRST download lightweight objectives, settings, code, logs, aggregate results, analysis and decisions to D:\\MTO\\archives\\ and verify hashes; THEN inspect exact staged bytes, commit, non-force push and verify the remote. Preserve existing archival ancestry and sealed snapshots. Never publish checkpoints, weights, learned coefficient arrays, optimizer states, raw data, identity/split arrays, prediction arrays, caches or credentials. Continue authorized unfinished stages and archival work, then maintain concise handoffs and the next reviewed decision.\n\nStay quiet while the state is unchanged or non-actionable. Report only meaningful progress, completion, failure or required user action."
